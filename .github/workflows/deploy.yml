name: Deploy

# Builds the client and deploys it to the fire-calculator Static Web App (fire-calculator.nexaisolution.com).
# Static only: the calculator runs in the browser; the Express/tRPC server (login, saved scenarios) is not deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run client # server tests need a MySQL database; the server is not deployed
      - run: pnpm exec vite build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/public
          skip_app_build: true
